<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quiz — Adjectives + Past Tense</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1.5rem 1rem;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.2rem; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .tabs button {
    background: var(--card); color: var(--muted); border: 1px solid #334155;
    padding: 0.55rem 1.1rem; border-radius: 999px; cursor: pointer; font-size: 0.9rem;
  }
  .tabs button.active { background: var(--accent); color: #082f49; border-color: var(--accent); font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid #334155; border-radius: 1rem;
    padding: 1.5rem; max-width: 640px; width: 100%;
  }
  .hidden { display: none; }
  .progress { color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .progress-row .progress { margin-bottom: 0; }
  select {
    background: #0f172a; border: 1px solid #334155; color: var(--muted);
    border-radius: 0.4rem; padding: 0.25rem 0.5rem; font-size: 0.8rem;
  }
  .adjective { font-size: 1.6rem; font-weight: 700; }
  .gloss { color: var(--muted); font-size: 0.9rem; margin: 0.3rem 0 1.2rem; }
  .sentence { font-size: 1.15rem; margin-bottom: 1rem; }
  input[type="text"] {
    background: #0f172a; border: 2px solid #334155; color: var(--text);
    border-radius: 0.5rem; padding: 0.45rem 0.7rem; font-size: 1rem;
    outline: none; transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input.good { border-color: var(--ok); }
  input.bad { border-color: var(--bad); }
  .gap-input { width: 7.5rem; margin: 0 0.15rem; font-size: 0.95rem; padding: 0.25rem 0.5rem; }
  .prep-input { width: 6rem; text-align: center; }
  .btn {
    background: var(--accent); color: #082f49; border: none; border-radius: 0.5rem;
    padding: 0.6rem 1.2rem; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--muted); border: 1px solid #334155; }
  .btn-row { display: flex; gap: 0.6rem; margin-top: 1.2rem; flex-wrap: wrap; }
  .feedback { min-height: 1.4rem; margin-top: 0.8rem; font-size: 0.95rem; }
  .feedback.ok { color: var(--ok); }
  .feedback.err { color: var(--bad); }
  .score { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }
  .text-title { font-weight: 700; margin-bottom: 0.8rem; color: var(--accent); }
  .text-body { line-height: 2.3; font-size: 1rem; }
  .verb-hint { color: var(--muted); font-size: 0.85rem; }
  .summary { text-align: center; }
  .summary .big { font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0; }
</style>
</head>
<body>
  <h1>English Quiz</h1>
  <p class="sub">adjective + preposition · verbs in the past</p>

  <div class="tabs">
    <button id="tab-adj" class="active" onclick="showTab('adj')">Adjective + Preposition</button>
    <button id="tab-past" onclick="showTab('past')">Past Tense Texts</button>
  </div>

  <!-- MODE 1: adjective + preposition -->
  <div id="mode-adj" class="card">
    <div class="progress-row">
      <div class="progress" id="adj-progress"></div>
      <label style="color:var(--muted);font-size:0.8rem">velocidad
        <select id="speed">
          <option value="instant" selected>instantánea</option>
          <option value="fast">rápida</option>
          <option value="normal">normal</option>
          <option value="slow">lenta</option>
        </select>
      </label>
    </div>
    <div class="adjective" id="adj-word"></div>
    <div class="gloss" id="adj-gloss"></div>
    <div class="sentence" id="adj-sentence"></div>
    <div>
      <input type="text" id="adj-input" class="prep-input" placeholder="preposition"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="feedback" id="adj-feedback"></div>
    <div class="btn-row">
      <button class="btn" onclick="checkAdj()">Check</button>
      <button class="btn secondary" onclick="skipAdj()">Skip</button>
    </div>
    <div class="score" id="adj-score"></div>
  </div>

  <!-- MODE 2: past tense texts -->
  <div id="mode-past" class="card hidden">
    <div id="past-menu"></div>
    <div id="past-quiz" class="hidden">
      <div class="text-title" id="past-title"></div>
      <div class="text-body" id="past-body"></div>
      <div class="btn-row">
        <button class="btn" onclick="checkText()">Check all</button>
        <button class="btn secondary" onclick="resetText()">Reset</button>
        <button class="btn secondary" onclick="backToMenu()">Another text</button>
      </div>
      <div class="feedback" id="past-feedback"></div>
    </div>
  </div>

<script>
/* ================= DATA ================= */

const ADJ = [
  ["afraid", "of", "asustado por/a"],
  ["angry", "with", "enfadado con"],
  ["annoyed", "with", "molesto con"],
  ["ashamed", "of", "avergonzado de"],
  ["aware", "of", "consciente de"],
  ["bad", "at", "malo en"],
  ["bored", "with", "aburrido de"],
  ["capable", "of", "capaz de"],
  ["crazy", "about", "loco por"],
  ["dependent", "on", "dependiente de"],
  ["different", "from", "diferente de/a"],
  ["disappointed", "with", "decepcionado con"],
  ["excited", "about", "emocionado por"],
  ["famous", "for", "famoso por"],
  ["fed up", "with", "harto de"],
  ["fond", "of", "aficionado a"],
  ["frightened", "of", "asustado de"],
  ["full", "of", "lleno de"],
  ["good", "at", "bueno en"],
  ["guilty", "of", "culpable de"],
  ["happy", "with", "contento con"],
  ["interested", "in", "interesado en"],
  ["jealous", "of", "celoso de"],
  ["keen", "on", "entusiasmado con"],
  ["kind", "to", "amable con"],
  ["late", "for", "tarde a/para"],
  ["married", "to", "casado con"],
  ["nervous", "about", "nervioso por"],
  ["pleased", "with", "satisfecho con"],
  ["popular", "with", "popular entre"],
  ["proud", "of", "orgulloso de"],
  ["ready", "for", "listo para"],
  ["responsible", "for", "responsable de"],
  ["sad", "about", "triste por"],
  ["scared", "of", "asustado de"],
  ["similar", "to", "similar a"],
  ["sorry", "for", "arrepentido por"],
  ["suitable", "for", "adecuado para"],
  ["sure", "of", "seguro de"],
  ["surprised", ["at", "by"], "sorprendido por"],
  ["terrified", "of", "aterrorizado de"],
  ["tired", "of", "cansado de"],
  ["typical", "of", "típico de"],
  ["worried", "about", "preocupado por"]
];

// answers: each gap accepts an array of valid past forms (lowercase)
const TEXTS = [
  {
    title: "1 · A Strange Night",
    html: `Last Saturday I {1|went} (go) to the cinema with my friends. We {2|had bought} (buy) the tickets online the day before, so we {3|didn't have} (not have) to queue. The film {4|was} (be) terrifying and while we {5|were watching} (watch) it, my friend Lucas {6|was eating} (eat) popcorn non-stop. When the film {7|finished} (finish), it {8|was raining} (rain) outside. We {9|didn't have} (not have) an umbrella, so we {10|ran} (run) to the nearest bus stop.`
  },
  {
    title: "2 · The Lost Keys",
    html: `Yesterday morning Tom {1|woke up} (wake up) late. He {2|got} (get) dressed quickly and {3|left} (leave) the house. While he {4|was walking} (walk) to school, he {5|realised} (realise) that he {6|had forgotten} (forget) his keys at home. He {7|went back} (go back) immediately, but when he {8|arrived} (arrive), nobody {9|was} (be) there. He {10|spent} (spend) an hour waiting in the cold.`
  },
  {
    title: "3 · The Empty House",
    html: `When I {1|arrived} (arrive) home last night, I {2|knew} (know) something was wrong. Somebody {3|had broken} (break) the window and {4|had taken} (take) my laptop. The thieves {5|had eaten} (eat) all the food in the fridge too! I {6|called} (call) the police and while I {7|was waiting} (wait) for them, I {8|found} (find) a muddy footprint on the carpet. The officer who {9|came} (come) {10|said} (say) it was the third robbery that week.`
  }
];

/* ================= ADJECTIVE MODE ================= */

let deck = [], adjIndex = 0, adjScore = 0, adjAnswered = 0, locked = false;

// delays [acierto, fallo] en ms por velocidad
const SPEEDS = {
  instant:[0, 900],
  fast:   [250, 1200],
  normal: [700, 1800],
  slow:   [1300, 3000]
};

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function norm(s) { return s.trim().toLowerCase(); }

// canonicaliza: minúsculas, sin espacios extra y contracciones expandidas
// (didn't = did not, hadn't = had not, wasn't = was not, 'd = had, 've = have)
function canon(s) {
  return norm(s)
    .replace(/can[’']t\b/g, "can not")
    .replace(/won[’']t\b/g, "will not")
    .replace(/(\w)n[’']t\b/g, "$1 not")
    .replace(/(\w)[’']ve\b/g, "$1 have")
    .replace(/(\w)[’']d\b/g, "$1 had")
    .replace(/\s+/g, ' ');
}

function startAdj() {
  deck = shuffle([...ADJ]);
  adjIndex = 0; adjScore = 0; adjAnswered = 0;
  nextAdj();
}

function nextAdj() {
  const fb = document.getElementById('adj-feedback');
  fb.textContent = ''; fb.className = 'feedback';
  locked = false;
  const inp = document.getElementById('adj-input');
  inp.value = ''; inp.className = 'prep-input'; inp.focus();

  if (adjIndex >= deck.length) {
    document.getElementById('adj-word').textContent = '¡Hecho!';
    document.getElementById('adj-gloss').textContent = '';
    document.getElementById('adj-sentence').textContent = '';
    document.getElementById('adj-progress').textContent = '';
    document.getElementById('adj-score').textContent =
      `Resultado: ${adjScore}/${deck.length} (${Math.round(adjScore / deck.length * 100)}%). Pulsa Skip para repetir.`;
    return;
  }
  const [adj, , gloss] = deck[adjIndex];
  document.getElementById('adj-progress').textContent = `${adjIndex + 1} / ${deck.length}`;
  document.getElementById('adj-word').textContent = adj;
  document.getElementById('adj-gloss').textContent = `(${gloss})`;
  document.getElementById('adj-sentence').textContent = `She is ${adj} ___ ...`;
  document.getElementById('adj-score').textContent = `Aciertos: ${adjScore}`;
}

function checkAdj() {
  if (adjIndex >= deck.length) return;
  const [adj, prep] = deck[adjIndex];
  const valids = Array.isArray(prep) ? prep : [prep];
  const inp = document.getElementById('adj-input');
  const fb = document.getElementById('adj-feedback');
  const guess = norm(inp.value);
  if (!guess || locked) return;
  locked = true;
  adjAnswered++;
  const [okMs, errMs] = SPEEDS[document.getElementById('speed').value];
  let delay;
  if (valids.includes(guess)) {
    adjScore++;
    inp.classList.add('good');
    fb.textContent = `✓ "${adj} ${valids[0]}"`; fb.className = 'feedback ok';
    delay = okMs;
  } else {
    inp.classList.add('bad');
    fb.textContent = `✗ Era "${valids.join('" o "')}" → ${adj} ${valids[0]}`; fb.className = 'feedback err';
    delay = errMs;
  }
  adjIndex++;
  setTimeout(nextAdj, delay);
}

function skipAdj() {
  if (adjIndex >= deck.length) { startAdj(); return; }
  adjIndex++;
  nextAdj();
}

document.getElementById('adj-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAdj();
});

/* ================= PAST TENSE MODE ================= */

let gaps = [];

function renderMenu() {
  const menu = document.getElementById('past-menu');
  menu.innerHTML = '<div class="text-title">Elige un texto</div>' +
    TEXTS.map((t, i) =>
      `<div class="btn-row"><button class="btn" onclick="openText(${i})">${t.title}</button></div>`
    ).join('');
}

function openText(i) {
  document.getElementById('past-menu').classList.add('hidden');
  document.getElementById('past-quiz').classList.remove('hidden');
  document.getElementById('past-title').textContent = TEXTS[i].title;
  gaps = [];
  let id = 0;
  const body = TEXTS[i].html.replace(/\{(\d+)\|([^}]+)\}/g, (m, n, ans) => {
    gaps.push(ans.split('|').map(canon));
    return `<input type="text" class="gap-input" data-gap="${id++}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  });
  document.getElementById('past-body').innerHTML = body;
  document.getElementById('past-feedback').textContent = '';
  document.querySelectorAll('.gap-input').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkText(); });
  });
}

function checkText() {
  let ok = 0, filled = 0;
  document.querySelectorAll('.gap-input').forEach(inp => {
    const valid = gaps[+inp.dataset.gap];
    const guess = canon(inp.value);
    inp.classList.remove('good', 'bad');
    if (!guess) return;
    filled++;
    if (valid.includes(guess)) { ok++; inp.classList.add('good'); }
    else inp.classList.add('bad');
  });
  const fb = document.getElementById('past-feedback');
  if (filled < gaps.length) {
    fb.textContent = `${ok}/${gaps.length} correctas — te quedan ${gaps.length - filled} huecos.`;
    fb.className = 'feedback';
  } else if (ok === gaps.length) {
    fb.textContent = `¡Perfecto! ${ok}/${gaps.length}`;
    fb.className = 'feedback ok';
  } else {
    fb.textContent = `${ok}/${gaps.length} correctas. Los rojos: revisa la forma correcta.`;
    fb.className = 'feedback err';
  }
}

function resetText() {
  document.querySelectorAll('.gap-input').forEach(i => { i.value = ''; i.classList.remove('good', 'bad'); });
  document.getElementById('past-feedback').textContent = '';
}

function backToMenu() {
  document.getElementById('past-quiz').classList.add('hidden');
  document.getElementById('past-menu').classList.remove('hidden');
}

/* ================= TABS ================= */

function showTab(t) {
  document.getElementById('mode-adj').classList.toggle('hidden', t !== 'adj');
  document.getElementById('mode-past').classList.toggle('hidden', t !== 'past');
  document.getElementById('tab-adj').classList.toggle('active', t === 'adj');
  document.getElementById('tab-past').classList.toggle('active', t === 'past');
}

/* init */
startAdj();
renderMenu();
</script>
</body>
</html>
