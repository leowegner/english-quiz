<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quiz — Adjectives + Past Tense</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1.5rem 1rem;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.2rem; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .tabs button {
    background: var(--card); color: var(--muted); border: 1px solid #334155;
    padding: 0.65rem 1.15rem; border-radius: 999px; cursor: pointer; font-size: 0.95rem;
    min-height: 44px;
  }
  .tabs button.active { background: var(--accent); color: #082f49; border-color: var(--accent); font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid #334155; border-radius: 1rem;
    padding: 1.5rem; max-width: 640px; width: 100%;
  }
  .hidden { display: none; }
  .progress { color: var(--muted); font-size: 0.8rem; margin-bottom: 1rem; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .progress-row .progress { margin-bottom: 0; }
  select {
    background: #0f172a; border: 1px solid #334155; color: var(--muted);
    border-radius: 0.4rem; padding: 0.3rem 0.5rem; font-size: 1rem;
  }
  button { touch-action: manipulation; }
  .adjective { font-size: 1.6rem; font-weight: 700; }
  .gloss { color: var(--muted); font-size: 0.9rem; margin: 0.3rem 0 1.2rem; }
  .sentence { font-size: 1.15rem; margin-bottom: 1rem; }
  input[type="text"] {
    background: #0f172a; border: 2px solid #334155; color: var(--text);
    border-radius: 0.5rem; padding: 0.45rem 0.7rem; font-size: 1rem;
    outline: none; transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  input.good { border-color: var(--ok); }
  input.bad { border-color: var(--bad); }
  .gap-input { width: 8.5rem; margin: 0 0.15rem; font-size: 1rem; padding: 0.3rem 0.5rem; }
  .prep-input { width: 6rem; text-align: center; }
  .btn {
    background: var(--accent); color: #082f49; border: none; border-radius: 0.5rem;
    padding: 0.75rem 1.3rem; font-size: 1rem; font-weight: 600; cursor: pointer;
    min-height: 44px;
  }
  .btn.secondary { background: transparent; color: var(--muted); border: 1px solid #334155; }
  .btn-row { display: flex; gap: 0.6rem; margin-top: 1.2rem; flex-wrap: wrap; }
  .feedback { min-height: 1.4rem; margin-top: 0.8rem; font-size: 0.95rem; }
  .feedback.ok { color: var(--ok); }
  .feedback.err { color: var(--bad); }
  .score { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; }
  .text-title { font-weight: 700; margin-bottom: 0.8rem; color: var(--accent); }
  .text-body { line-height: 2.3; font-size: 1rem; }
  .verb-hint { color: var(--muted); font-size: 0.85rem; }
  .summary { text-align: center; }
  .summary .big { font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0; }
</style>
</head>
<body>
  <h1>English Quiz</h1>
  <p class="sub">adjective + preposition · verbs in the past</p>

  <div class="tabs">
    <button id="tab-adj" class="active" onclick="showTab('adj')">Adjective + Preposition</button>
    <button id="tab-past" onclick="showTab('past')">Past Tense Texts</button>
  </div>

  <!-- MODE 1: adjective + preposition -->
  <div id="mode-adj" class="card">
    <div class="progress-row">
      <div class="progress" id="adj-progress"></div>
      <label style="color:var(--muted);font-size:0.8rem">velocidad
        <select id="speed">
          <option value="instant" selected>instantánea</option>
          <option value="fast">rápida</option>
          <option value="normal">normal</option>
          <option value="slow">lenta</option>
        </select>
      </label>
    </div>
    <div class="adjective" id="adj-word"></div>
    <div class="gloss" id="adj-gloss"></div>
    <div class="sentence" id="adj-sentence"></div>
    <div>
      <input type="text" id="adj-input" class="prep-input" placeholder="preposition"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             autocorrect="off" enterkeyhint="go">
    </div>
    <div class="feedback" id="adj-feedback"></div>
    <div class="btn-row">
      <button class="btn" onclick="checkAdj()">Check</button>
      <button class="btn secondary" onclick="skipAdj()">Skip</button>
    </div>
    <div class="score" id="adj-score"></div>
  </div>

  <!-- MODE 2: past tense texts -->
  <div id="mode-past" class="card hidden">
    <div id="past-menu"></div>
    <div id="past-quiz" class="hidden">
      <div class="text-title" id="past-title"></div>
      <div class="text-body" id="past-body"></div>
      <div class="btn-row">
        <button class="btn" onclick="checkText()">Check all</button>
        <button class="btn secondary" onclick="resetText()">Reset</button>
        <button class="btn secondary" onclick="backToMenu()">Another text</button>
      </div>
      <div class="feedback" id="past-feedback"></div>
    </div>
  </div>

<script>
/* ================= DATA ================= */

const ADJ = [
  ["afraid", "of", "asustado por/a"],
  ["angry", ["with", "at", "about"], "enfadado con"],
  ["annoyed", ["with", "at", "about"], "molesto con"],
  ["ashamed", "of", "avergonzado de"],
  ["aware", "of", "consciente de"],
  ["bad", "at", "malo en"],
  ["bored", ["with", "by"], "aburrido de"],
  ["capable", "of", "capaz de"],
  ["crazy", "about", "loco por"],
  ["dependent", "on", "dependiente de"],
  ["different", ["from", "than", "to"], "diferente de/a"],
  ["disappointed", ["with", "in", "at", "by"], "decepcionado con"],
  ["excited", ["about", "by"], "emocionado por"],
  ["famous", "for", "famoso por"],
  ["fed up", "with", "harto de"],
  ["fond", "of", "aficionado a"],
  ["frightened", ["of", "by"], "asustado de"],
  ["full", "of", "lleno de"],
  ["good", ["at", "with"], "bueno en"],
  ["guilty", "of", "culpable de"],
  ["happy", ["with", "about"], "contento con"],
  ["interested", "in", "interesado en"],
  ["jealous", "of", "celoso de"],
  ["keen", "on", "entusiasmado con"],
  ["kind", "to", "amable con"],
  ["late", "for", "tarde a/para"],
  ["married", "to", "casado con"],
  ["nervous", "about", "nervioso por"],
  ["pleased", ["with", "about"], "satisfecho con"],
  ["popular", "with", "popular entre"],
  ["proud", "of", "orgulloso de"],
  ["ready", "for", "listo para"],
  ["responsible", "for", "responsable de"],
  ["sad", "about", "triste por"],
  ["scared", ["of", "by"], "asustado de"],
  ["similar", "to", "similar a"],
  ["sorry", ["for", "about"], "arrepentido por"],
  ["suitable", "for", "adecuado para"],
  ["sure", ["of", "about"], "seguro de"],
  ["surprised", ["at", "by"], "sorprendido por"],
  ["terrified", ["of", "by"], "aterrorizado de"],
  ["tired", "of", "cansado de"],
  ["typical", "of", "típico de"],
  ["worried", ["about", "by"], "preocupado por"]
];

// answers: each gap accepts an array of valid past forms (lowercase)
const TEXTS = [
  {
    title: "1 · A Strange Night",
    html: `Last Saturday, while I {1|was walking} (walk) to the cinema, my friends {2|had already bought} (already buy) the tickets. While we {3|were waiting} (wait) for the film to start, we {4|were talking} (talk) about school. The film {5|started} (start) — it was terrifying! During the scariest scene, Lucas {6|was eating} (eat) popcorn non-stop. When the film {7|ended} (end), it {8|was raining} (rain) outside and the streets {9|had flooded} (flood) a little. We {10|ran} (run) to the bus stop.`
  },
  {
    title: "2 · The Lost Keys",
    html: `Yesterday Tom {1|woke up} (wake up) late because he {2|had been studying} (study) until 3 a.m. While he {3|was getting} (get) dressed, he {4|was listening} (listen) to music. He {5|had left} (leave) his keys somewhere and he {6|was looking} (look) for them everywhere. While he {7|was searching} (search) his room, his mother {8|had already gone} (already go) to work. He {9|found} (find) them in his jacket and {10|rushed} (rush) to school.`
  },
  {
    title: "3 · The Empty House",
    html: `When I {1|arrived} (arrive) home, I {2|was feeling} (feel) that something was wrong. Somebody {3|had broken} (break) the window and {4|had taken} (take) my laptop. While I {5|was checking} (check) the rooms, I {6|was shaking} (shake). The thieves {7|had eaten} (eat) all the food too! I {8|called} (call) the police. While they {9|were coming} (come), I {10|was still trembling} (still tremble).`
  },
  {
    title: "4 · The Camping Trip",
    html: `We {1|had been driving} (drive) for three hours when it {2|started} (start) to rain. We {3|had forgotten} (forget) the matches, so while my brother {4|was trying} (try) to fix the tent, I {5|was looking} (look) for dry wood. The rain {6|wasn't stopping} (not stop) and after two hours we {7|were freezing} (freeze). Luckily we {8|had brought} (bring) sleeping bags, and in the end we {9|slept} (sleep) in the car while it {10|was still raining} (still rain) outside.`
  },
  {
    title: "5 · The Football Final",
    html: `While we {1|were playing} (play) the final, thousands of fans {2|were shouting} (shout) in the stands. We {3|had lost} (lose) our last three matches and at half-time we {4|were losing} (lose) again. Then Martín, who {5|had never scored} (never score) before, {6|scored} (score) twice! While the crowd {7|was celebrating} (celebrate), the referee {8|was checking} (check) his watch. When he {9|blew} (blow) the whistle, the whole stadium {10|exploded} (explode).`
  },
  {
    title: "6 · A Day at the Hospital",
    html: `Anna {1|fell} (fall) off her bike while she {2|was riding} (ride) to school — she {3|had broken} (break) her arm! While her dad {4|was driving} (drive) her to hospital, she {5|was crying} (cry) quietly. She {6|had never been} (never be) to hospital before. While they {7|were waiting} (wait) for the X-ray, a nurse {8|was talking} (talk) to her kindly, but the pain {9|was getting} (get) worse. Finally a doctor {10|put} (put) a cast on her arm.`
  },
  {
    title: "7 · The First Job",
    html: `On my first day I {1|had woken up} (wake up) at 5 a.m. — too nervous to sleep. While I {2|was walking} (walk) to the office, I {3|was rehearsing} (rehearse) my introduction in my head. I {4|arrived} (arrive) an hour early, but nobody {5|had arrived} (arrive) yet. While I {6|was waiting} (wait) at reception, I {7|was reading} (read) the welcome manual. By the time my boss {8|came} (come), I {9|had memorized} (memorize) everyone's name. She {10|was impressed} (be impressed).`
  },
  {
    title: "8 · The Power Cut",
    html: `I {1|had been doing|was doing} (do) my homework for two hours when the lights {2|were flickering} (flicker) and then {3|went} (go) out. Lightning {4|had hit} (hit) the power station during the storm. While we {5|were looking} (look) for candles, my little sister {6|was crying} (cry) — she {7|had never experienced} (never experience) a blackout. We {8|were playing} (play) cards by candlelight when the electricity finally {9|came back} (come back), just as we {10|were getting} (get) ready for bed.`
  },
  {
    title: "9 · The Exam",
    html: `That morning I {1|had been studying|had studied} (study) all weekend, but I {2|was still feeling} (still feel) nervous. While the teacher {3|was handing out} (hand out) the papers, my hands {4|were shaking} (shake) and my mind {5|was racing} (race). Then I {6|read} (read) the first question — I {7|knew} (know) it! While everyone {8|was panicking} (panic), I {9|was writing} (write) calmly. When I {10|had finished} (finish), there were still ten minutes left.`
  },
  {
    title: "10 · The New Puppy",
    html: `While we {1|were bringing} (bring) the puppy home, it {2|was shivering} (shiver) in its box. That first night it {3|had been crying|cried} (cry) for hours because it {4|had never slept} (never sleep) alone. While I {5|was sleeping} (sleep), it {6|chewed} (chew) my trainers. I {7|discovered} (discover) the disaster in the morning — it {8|had also eaten} (also eat) my homework! While I {9|was getting} (get) angry, it {10|was looking} (look) at me with those big eyes, and I couldn't be mad.`
  },
  {
    title: "11 · The Flight",
    html: `While we {1|were driving} (drive) to the airport, they {2|had already delayed} (already delay) our flight twice. At the gate, everyone {3|was complaining} (complain) and kids {4|were crying} (cry). The airline {5|gave} (give) us vouchers after we {6|had been waiting} (wait) for two hours. While we {7|were eating} (eat), I {8|was reading} (read) my new book. We {9|finally boarded} (finally board) six hours later, and while the plane {10|was taking off} (take off), I fell asleep instantly.`
  },
  {
    title: "12 · The Concert",
    html: `I {1|had been waiting} (wait) months for this concert and {2|had bought} (buy) the tickets early, so while others {3|were queuing} (queue), we {4|were already sitting} (already sit) in our seats. When the lights {5|went} (go) down, everyone {6|was screaming} (scream). While they {7|were playing} (play) the first song, the whole arena {8|was singing} (sing) along. They {9|sang} (sing) my favourite song twice while we {10|were dancing} (dance).`
  },
  {
    title: "13 · The Science Experiment",
    html: `We {1|had been mixing} (mix) the chemicals for ten minutes when the liquid suddenly {2|turned} (turn) green and {3|started} (start) to smoke — someone {4|had put} (put) the wrong bottle on the shelf! While the teacher {5|was shouting} (shout) instructions, we {6|were running} (run) to the corridor. Luckily nobody {7|had been} (be) hurt. The smell {8|was getting} (get) worse, so they {9|closed} (close) the lab while the fire brigade {10|was checking} (check) everything.`
  }
];

/* ================= ADJECTIVE MODE ================= */

let deck = [], adjIndex = 0, adjScore = 0, adjAnswered = 0, locked = false;

// delays [acierto, fallo] en ms por velocidad
const SPEEDS = {
  instant:[0, 900],
  fast:   [250, 1200],
  normal: [700, 1800],
  slow:   [1300, 3000]
};

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function norm(s) { return s.trim().toLowerCase(); }

// canonicaliza: minúsculas, sin espacios extra y contracciones expandidas
// (didn't = did not, hadn't = had not, wasn't = was not, 'd = had, 've = have)
function canon(s) {
  return norm(s)
    .replace(/can[’']t\b/g, "can not")
    .replace(/won[’']t\b/g, "will not")
    .replace(/(\w)n[’']t\b/g, "$1 not")
    .replace(/(\w)[’']ve\b/g, "$1 have")
    .replace(/(\w)[’']d\b/g, "$1 had")
    .replace(/\s+/g, ' ');
}

function startAdj() {
  deck = shuffle([...ADJ]);
  adjIndex = 0; adjScore = 0; adjAnswered = 0;
  nextAdj();
}

function nextAdj() {
  const fb = document.getElementById('adj-feedback');
  fb.textContent = ''; fb.className = 'feedback';
  locked = false;
  const inp = document.getElementById('adj-input');
  inp.value = ''; inp.className = 'prep-input'; inp.focus();

  if (adjIndex >= deck.length) {
    document.getElementById('adj-word').textContent = '¡Hecho!';
    document.getElementById('adj-gloss').textContent = '';
    document.getElementById('adj-sentence').textContent = '';
    document.getElementById('adj-progress').textContent = '';
    document.getElementById('adj-score').textContent =
      `Resultado: ${adjScore}/${deck.length} (${Math.round(adjScore / deck.length * 100)}%). Pulsa Skip para repetir.`;
    return;
  }
  const [adj, , gloss] = deck[adjIndex];
  document.getElementById('adj-progress').textContent = `${adjIndex + 1} / ${deck.length}`;
  document.getElementById('adj-word').textContent = adj;
  document.getElementById('adj-gloss').textContent = `(${gloss})`;
  document.getElementById('adj-sentence').textContent = `She is ${adj} ___ ...`;
  document.getElementById('adj-score').textContent = `Aciertos: ${adjScore}`;
}

function checkAdj() {
  if (adjIndex >= deck.length) return;
  const [adj, prep] = deck[adjIndex];
  const valids = Array.isArray(prep) ? prep : [prep];
  const inp = document.getElementById('adj-input');
  const fb = document.getElementById('adj-feedback');
  const guess = norm(inp.value);
  if (!guess || locked) return;
  locked = true;
  adjAnswered++;
  const [okMs, errMs] = SPEEDS[document.getElementById('speed').value];
  let delay;
  if (valids.includes(guess)) {
    adjScore++;
    inp.classList.add('good');
    fb.textContent = `✓ "${adj} ${valids[0]}"`; fb.className = 'feedback ok';
    delay = okMs;
  } else {
    inp.classList.add('bad');
    fb.textContent = `✗ Era "${valids.join('" o "')}" → ${adj} ${valids[0]}`; fb.className = 'feedback err';
    delay = errMs;
  }
  adjIndex++;
  setTimeout(nextAdj, delay);
}

function skipAdj() {
  if (adjIndex >= deck.length) { startAdj(); return; }
  adjIndex++;
  nextAdj();
}

document.getElementById('adj-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAdj();
});

/* ================= PAST TENSE MODE ================= */

let gaps = [];

function renderMenu() {
  const menu = document.getElementById('past-menu');
  menu.innerHTML = '<div class="text-title">Elige un texto</div>' +
    TEXTS.map((t, i) =>
      `<div class="btn-row"><button class="btn" onclick="openText(${i})">${t.title}</button></div>`
    ).join('');
}

function openText(i) {
  document.getElementById('past-menu').classList.add('hidden');
  document.getElementById('past-quiz').classList.remove('hidden');
  document.getElementById('past-title').textContent = TEXTS[i].title;
  gaps = [];
  let id = 0;
  const body = TEXTS[i].html.replace(/\{(\d+)\|([^}]+)\}/g, (m, n, ans) => {
    gaps.push(ans.split('|').map(canon));
    return `<input type="text" class="gap-input" data-gap="${id++}" autocomplete="off" autocapitalize="off" spellcheck="false" autocorrect="off" enterkeyhint="go">`;
  });
  document.getElementById('past-body').innerHTML = body;
  document.getElementById('past-feedback').textContent = '';
  document.querySelectorAll('.gap-input').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkText(); });
  });
}

function checkText() {
  let ok = 0, filled = 0;
  document.querySelectorAll('.gap-input').forEach(inp => {
    const valid = gaps[+inp.dataset.gap];
    const guess = canon(inp.value);
    inp.classList.remove('good', 'bad');
    if (!guess) return;
    filled++;
    if (valid.includes(guess)) { ok++; inp.classList.add('good'); }
    else inp.classList.add('bad');
  });
  const fb = document.getElementById('past-feedback');
  if (filled < gaps.length) {
    fb.textContent = `${ok}/${gaps.length} correctas — te quedan ${gaps.length - filled} huecos.`;
    fb.className = 'feedback';
  } else if (ok === gaps.length) {
    fb.textContent = `¡Perfecto! ${ok}/${gaps.length}`;
    fb.className = 'feedback ok';
  } else {
    fb.textContent = `${ok}/${gaps.length} correctas. Los rojos: revisa la forma correcta.`;
    fb.className = 'feedback err';
  }
}

function resetText() {
  document.querySelectorAll('.gap-input').forEach(i => { i.value = ''; i.classList.remove('good', 'bad'); });
  document.getElementById('past-feedback').textContent = '';
}

function backToMenu() {
  document.getElementById('past-quiz').classList.add('hidden');
  document.getElementById('past-menu').classList.remove('hidden');
}

/* ================= TABS ================= */

function showTab(t) {
  document.getElementById('mode-adj').classList.toggle('hidden', t !== 'adj');
  document.getElementById('mode-past').classList.toggle('hidden', t !== 'past');
  document.getElementById('tab-adj').classList.toggle('active', t === 'adj');
  document.getElementById('tab-past').classList.toggle('active', t === 'past');
}

/* init */
startAdj();
renderMenu();
</script>
</body>
</html>
